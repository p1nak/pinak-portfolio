<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Swiss Style Monogram Icon for Pinak Chauhan -->
  <rect width="64" height="64" rx="14" fill="#202321"/>
  <!-- Geometric grid lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#315BE8" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#315BE8" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Neural node circles -->
  <circle cx="20" cy="20" r="5" fill="#315BE8"/>
  <circle cx="44" cy="20" r="4" fill="#9CAF88"/>
  <circle cx="44" cy="44" r="5" fill="#315BE8"/>
  <circle cx="20" cy="44" r="4" fill="#F3EFE6"/>
  <!-- Precision vector paths representing 'P' and 'C' -->
  <path d="M 20 44 L 20 20 L 32 20 C 37 20 41 24 41 28 C 41 32 37 36 32 36 L 20 36" stroke="#F3EFE6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 44 38 C 41 42 36 44 30 44 C 22 44 16 38 16 30" stroke="#CC6A42" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 2"/>
  <!-- Center focal spark -->
  <circle cx="32" cy="28" r="2.5" fill="#CC6A42"/>
</svg>
