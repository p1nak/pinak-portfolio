<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" class="project-vector-art">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#161817"/>
    </linearGradient>
    <linearGradient id="cl-roc-fill" x1="60" y1="60" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#315BE8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#315BE8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="480" height="280" fill="url(#cl-bg)" rx="8"/>

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#F3EFE6" stroke-width="0.5">
    <line x1="40" y1="40" x2="440" y2="40"/>
    <line x1="40" y1="140" x2="440" y2="140"/>
    <line x1="40" y1="240" x2="440" y2="240"/>
    <line x1="240" y1="20" x2="240" y2="260"/>
  </g>

  <!-- Technical Headings -->
  <text x="40" y="30" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="8.5" letter-spacing="1">EVAL // XGBOOST ROC-AUC</text>
  <text x="440" y="30" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">N = 32,416 CLEANED</text>

  <!-- LEFT: ROC-AUC 0.939 Visual Space -->
  <!-- Axes -->
  <line x1="60" y1="220" x2="220" y2="220" stroke="#F3EFE6" stroke-width="1.2" opacity="0.5"/>
  <line x1="60" y1="220" x2="60" y2="60" stroke="#F3EFE6" stroke-width="1.2" opacity="0.5"/>
  <!-- Random Diagonal 0.5 -->
  <line x1="60" y1="220" x2="220" y2="60" stroke="#F3EFE6" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- ROC Curve Area & Path (AUC 0.939) -->
  <path d="M 60 220 L 60 85 Q 70 65, 120 62 L 220 60 L 220 220 Z" fill="url(#cl-roc-fill)"/>
  <path d="M 60 220 C 60 110, 85 64, 220 60" fill="none" stroke="#315BE8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ROC Tag -->
  <rect x="75" y="80" width="85" height="24" rx="4" fill="#202321" stroke="#315BE8" stroke-width="1"/>
  <text x="117" y="96" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">ROC-AUC: 0.939</text>

  <!-- Axis labels -->
  <text x="140" y="235" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5" opacity="0.6" text-anchor="middle">False Positive Rate</text>
  <text x="45" y="140" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5" opacity="0.6" text-anchor="middle" transform="rotate(-90 45 140)">True Positive Rate</text>

  <!-- RIGHT: SHAP Interpretability and Decision Threshold -->
  <text x="255" y="58" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8.5" opacity="0.9">SHAP FEATURE ATTRIBUTION</text>

  <!-- SHAP Bar 1: Debt-to-Income -->
  <text x="255" y="80" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="8">Debt-to-Income Ratio</text>
  <rect x="255" y="86" width="170" height="8" rx="2" fill="#202321" stroke="#315BE8" stroke-width="0.8"/>
  <rect x="255" y="86" width="135" height="8" rx="2" fill="#315BE8"/>
  <text x="398" y="94" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5">+0.42</text>

  <!-- SHAP Bar 2: Revolving Utilization -->
  <text x="255" y="112" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="8">Revolving Line Util.</text>
  <rect x="255" y="118" width="170" height="8" rx="2" fill="#202321" stroke="#CC6A42" stroke-width="0.8"/>
  <rect x="255" y="118" width="105" height="8" rx="2" fill="#CC6A42"/>
  <text x="368" y="126" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5">+0.31</text>

  <!-- SHAP Bar 3: Annual Income -->
  <text x="255" y="144" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="8">Annual Verified Income</text>
  <rect x="255" y="150" width="170" height="8" rx="2" fill="#202321" stroke="#9CAF88" stroke-width="0.8"/>
  <rect x="255" y="150" width="75" height="8" rx="2" fill="#9CAF88"/>
  <text x="338" y="158" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5">-0.24</text>

  <!-- Decision Threshold Gauge (0.7331) -->
  <g transform="translate(255, 185)">
    <text x="0" y="0" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8.5">DECISION THRESHOLD: 0.7331</text>
    <line x1="0" y1="16" x2="175" y2="16" stroke="#D8C9B5" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="16" x2="128" y2="16" stroke="#315BE8" stroke-width="3"/>
    <!-- Marker circle -->
    <circle cx="128" cy="16" r="6" fill="#CC6A42" stroke="#F3EFE6" stroke-width="1.5"/>
    <text x="128" y="34" fill="#CC6A42" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">θ = 0.7331</text>
    <text x="0" y="34" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" opacity="0.6">0.0</text>
    <text x="175" y="34" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" opacity="0.6" text-anchor="end">1.0</text>
  </g>
</svg>
