<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" class="project-vector-art">
  <defs>
    <linearGradient id="ind-bg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#181A19"/>
    </linearGradient>
  </defs>

  <rect width="480" height="280" fill="url(#ind-bg)" rx="8"/>

  <text x="24" y="32" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.8">INDUSTRY // DIGITAL QC SYSTEM</text>
  <text x="456" y="32" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="end">INFLUXDB • GRAFANA • QR</text>

  <!-- Left: Digital Inspection & QR Serialization -->
  <g transform="translate(40, 60)">
    <text x="0" y="10" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8">SHOPFLOOR DIGITAL AUDIT</text>

    <!-- Inspection Form Mockup Card -->
    <rect x="0" y="22" width="160" height="135" rx="4" fill="#202321" stroke="#315BE8" stroke-width="1.2"/>
    <rect x="12" y="35" width="80" height="8" rx="2" fill="#315BE8"/>
    <line x1="12" y1="52" x2="148" y2="52" stroke="#F3EFE6" stroke-width="0.5" opacity="0.2"/>

    <!-- Checklist rows -->
    <circle cx="20" cy="65" r="4" fill="#9CAF88"/>
    <text x="32" y="68" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5">Hydraulic Pressure: 140 bar</text>

    <circle cx="20" cy="85" r="4" fill="#9CAF88"/>
    <text x="32" y="88" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5">Bearing Vibration: Pass</text>

    <circle cx="20" cy="105" r="4" fill="#CC6A42"/>
    <text x="32" y="108" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5">Surface Defect: Logged [JPG]</text>

    <circle cx="20" cy="125" r="4" fill="#9CAF88"/>
    <text x="32" y="128" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5">Digital Sign-off: Verified</text>

    <!-- QR code matrix stamp -->
    <g transform="translate(105, 30)">
      <rect width="40" height="40" fill="#F3EFE6" rx="2"/>
      <rect x="4" y="4" width="10" height="10" fill="#202321"/>
      <rect x="6" y="6" width="6" height="6" fill="#F3EFE6"/>
      <rect x="26" y="4" width="10" height="10" fill="#202321"/>
      <rect x="28" y="6" width="6" height="6" fill="#F3EFE6"/>
      <rect x="4" y="26" width="10" height="10" fill="#202321"/>
      <rect x="6" y="28" width="6" height="6" fill="#F3EFE6"/>
      <rect x="18" y="18" width="5" height="5" fill="#202321"/>
      <rect x="26" y="20" width="8" height="4" fill="#202321"/>
      <rect x="18" y="28" width="6" height="6" fill="#202321"/>
    </g>
  </g>

  <!-- Right: InfluxDB + Grafana Real-Time Telemetry Stream -->
  <g transform="translate(235, 60)">
    <text x="0" y="10" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8">SAND PLANT TELEMETRY (GRAFANA)</text>

    <!-- Telemetry Chart 1: Sand Flow Temperature & Energy -->
    <rect x="0" y="22" width="205" height="62" rx="4" fill="#202321" stroke="#9CAF88" stroke-width="1"/>
    <text x="10" y="36" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7">ENERGY INGESTION (kW/h)</text>
    <path d="M 10 70 L 40 62 L 70 65 L 100 52 L 130 58 L 160 45 L 195 48" fill="none" stroke="#9CAF88" stroke-width="1.8"/>
    <text x="195" y="42" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="end">41.8 kW</text>

    <!-- Telemetry Chart 2: Telemetry InfluxDB Timestamp Pipeline -->
    <rect x="0" y="95" width="205" height="62" rx="4" fill="#202321" stroke="#315BE8" stroke-width="1"/>
    <text x="10" y="109" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="7">MULLER VIBRATION STREAM</text>
    <path d="M 10 142 L 35 130 L 60 148 L 85 125 L 110 138 L 135 118 L 160 132 L 195 128" fill="none" stroke="#315BE8" stroke-width="1.8"/>
    <text x="195" y="118" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="end">0.42 mm/s</text>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(40, 235)">
    <text x="0" y="8" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" opacity="0.6">PRODUCTION STACK: Flask REST Engine • SQLite Inspection Records • InfluxDB Time-Series • Grafana Dashboards</text>
  </g>
</svg>
