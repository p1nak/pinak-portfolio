<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" class="project-vector-art">
  <defs>
    <linearGradient id="amzn-bg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#181A19"/>
    </linearGradient>
  </defs>

  <rect width="480" height="280" fill="url(#amzn-bg)" rx="8"/>

  <text x="24" y="32" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.8">TIME-SERIES // AMZN VOLATILITY</text>
  <text x="456" y="32" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="end">SMA / BOLLINGER / RSI</text>

  <!-- Bollinger Band Channel -->
  <path d="M 60 110 Q 140 85, 200 95 T 320 70 T 430 80 L 430 160 Q 320 150, 260 170 T 140 165 T 60 170 Z" fill="#315BE8" fill-opacity="0.08"/>
  <path d="M 60 110 Q 140 85, 200 95 T 320 70 T 430 80" fill="none" stroke="#315BE8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <path d="M 60 170 Q 140 165, 260 170 T 320 150 T 430 160" fill="none" stroke="#315BE8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Candlesticks (Sample Sequence) -->
  <!-- Candle 1 Up -->
  <line x1="90" y1="120" x2="90" y2="155" stroke="#9CAF88" stroke-width="1"/>
  <rect x="86" y="130" width="8" height="18" fill="#9CAF88"/>

  <!-- Candle 2 Up -->
  <line x1="125" y1="110" x2="125" y2="145" stroke="#9CAF88" stroke-width="1"/>
  <rect x="121" y="118" width="8" height="20" fill="#9CAF88"/>

  <!-- Candle 3 Down -->
  <line x1="160" y1="115" x2="160" y2="160" stroke="#CC6A42" stroke-width="1"/>
  <rect x="156" y="125" width="8" height="26" fill="#CC6A42"/>

  <!-- Candle 4 Down -->
  <line x1="195" y1="130" x2="195" y2="175" stroke="#CC6A42" stroke-width="1"/>
  <rect x="191" y="140" width="8" height="24" fill="#CC6A42"/>

  <!-- Candle 5 Up Big Reversal -->
  <line x1="230" y1="95" x2="230" y2="150" stroke="#9CAF88" stroke-width="1"/>
  <rect x="226" y="105" width="8" height="35" fill="#9CAF88"/>

  <!-- Candle 6 Up -->
  <line x1="265" y1="80" x2="265" y2="125" stroke="#9CAF88" stroke-width="1"/>
  <rect x="261" y="88" width="8" height="25" fill="#9CAF88"/>

  <!-- Candle 7 Pullback -->
  <line x1="300" y1="75" x2="300" y2="115" stroke="#CC6A42" stroke-width="1"/>
  <rect x="296" y="82" width="8" height="18" fill="#CC6A42"/>

  <!-- Candle 8 Up Breakout -->
  <line x1="335" y1="65" x2="335" y2="105" stroke="#9CAF88" stroke-width="1"/>
  <rect x="331" y="70" width="8" height="28" fill="#9CAF88"/>

  <!-- Candle 9 Rally -->
  <line x1="370" y1="60" x2="370" y2="95" stroke="#9CAF88" stroke-width="1"/>
  <rect x="366" y="65" width="8" height="22" fill="#9CAF88"/>

  <!-- Candle 10 Consolidate -->
  <line x1="405" y1="68" x2="405" y2="100" stroke="#9CAF88" stroke-width="1"/>
  <rect x="401" y="74" width="8" height="15" fill="#9CAF88"/>

  <!-- SMA 20 Smooth Orange Curve -->
  <path d="M 60 145 C 120 140, 180 148, 240 115 C 300 85, 360 80, 430 75" fill="none" stroke="#CC6A42" stroke-width="2" stroke-linecap="round"/>

  <!-- Volume Histogram Subplot at bottom -->
  <line x1="40" y1="200" x2="440" y2="200" stroke="#F3EFE6" stroke-width="0.5" opacity="0.3"/>
  <rect x="86" y="205" width="8" height="18" fill="#9CAF88" opacity="0.6"/>
  <rect x="121" y="202" width="8" height="21" fill="#9CAF88" opacity="0.6"/>
  <rect x="156" y="195" width="8" height="28" fill="#CC6A42" opacity="0.6"/>
  <rect x="191" y="200" width="8" height="23" fill="#CC6A42" opacity="0.6"/>
  <rect x="226" y="185" width="8" height="38" fill="#9CAF88" opacity="0.8"/>
  <rect x="261" y="192" width="8" height="31" fill="#9CAF88" opacity="0.7"/>
  <rect x="296" y="208" width="8" height="15" fill="#CC6A42" opacity="0.6"/>
  <rect x="331" y="190" width="8" height="33" fill="#9CAF88" opacity="0.8"/>
  <rect x="366" y="196" width="8" height="27" fill="#9CAF88" opacity="0.7"/>
  <rect x="401" y="204" width="8" height="19" fill="#9CAF88" opacity="0.6"/>

  <text x="40" y="245" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" opacity="0.6">INDICATORS: SMA(20) [AMBER] • BOLLINGER BANDS [COBALT] • VOLUME OSCILLATOR</text>
</svg>
