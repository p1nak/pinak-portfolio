<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" class="project-vector-art">
  <defs>
    <linearGradient id="mlw-bg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#161817"/>
    </linearGradient>
  </defs>

  <rect width="480" height="280" fill="url(#mlw-bg)" rx="8"/>

  <text x="40" y="32" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1.5">PIPELINE // EDA • PCA • GRIDSEARCH CV</text>
  <text x="340" y="32" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="9">ALGORITHMIC WORKFLOWS</text>

  <!-- Left: PCA Eigenvector Projection -->
  <g transform="translate(40, 60)">
    <text x="0" y="10" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8">PCA EIGENVECTOR ROTATION</text>

    <!-- Axes -->
    <line x1="10" y1="140" x2="160" y2="140" stroke="#F3EFE6" stroke-width="0.8" opacity="0.3"/>
    <line x1="10" y1="140" x2="10" y2="20" stroke="#F3EFE6" stroke-width="0.8" opacity="0.3"/>

    <!-- Principal Component 1 (Primary Variance Vector) -->
    <line x1="20" y1="130" x2="150" y2="40" stroke="#315BE8" stroke-width="2.5"/>
    <polygon points="152,38 143,42 147,48" fill="#315BE8"/>
    <text x="156" y="38" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="7.5">PC-1 (68%)</text>

    <!-- Principal Component 2 (Orthogonal) -->
    <line x1="75" y1="92" x2="45" y2="50" stroke="#CC6A42" stroke-width="2"/>
    <polygon points="43,48 45,56 52,52" fill="#CC6A42"/>
    <text x="45" y="42" fill="#CC6A42" font-family="'JetBrains Mono', monospace" font-size="7.5">PC-2 (21%)</text>

    <!-- Dispersion Ellipse & Points -->
    <ellipse cx="85" cy="85" rx="55" ry="25" transform="rotate(-34 85 85)" fill="#315BE8" fill-opacity="0.1" stroke="#315BE8" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="50" cy="110" r="2.5" fill="#9CAF88"/>
    <circle cx="70" cy="95" r="2.5" fill="#9CAF88"/>
    <circle cx="85" cy="80" r="2.5" fill="#9CAF88"/>
    <circle cx="105" cy="70" r="2.5" fill="#9CAF88"/>
    <circle cx="125" cy="55" r="2.5" fill="#9CAF88"/>
  </g>

  <!-- Right: Hyperparameter Optimization Heatmap -->
  <g transform="translate(265, 60)">
    <text x="0" y="10" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8">GRIDSEARCH CV (C vs. γ)</text>

    <!-- Grid 4x4 matrix of parameters -->
    <g transform="translate(0, 24)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.2"/>
      <text x="19" y="16" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.782</text>
      <rect x="42" y="0" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.4"/>
      <text x="61" y="16" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.814</text>
      <rect x="84" y="0" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.65"/>
      <text x="103" y="16" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.862</text>
      <rect x="126" y="0" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.5"/>
      <text x="145" y="16" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.835</text>

      <!-- Row 2 -->
      <rect x="0" y="30" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.35"/>
      <text x="19" y="46" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.801</text>
      <rect x="42" y="30" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.7"/>
      <text x="61" y="46" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.873</text>
      <!-- OPTIMAL CELL -->
      <rect x="84" y="30" width="38" height="26" rx="2" fill="#CC6A42" stroke="#F3EFE6" stroke-width="1.2"/>
      <text x="103" y="46" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">.948*</text>
      <rect x="126" y="30" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.75"/>
      <text x="145" y="46" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.889</text>

      <!-- Row 3 -->
      <rect x="0" y="60" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.45"/>
      <text x="19" y="76" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.820</text>
      <rect x="42" y="60" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.6"/>
      <text x="61" y="76" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.858</text>
      <rect x="84" y="60" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.8"/>
      <text x="103" y="76" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.901</text>
      <rect x="126" y="60" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.55"/>
      <text x="145" y="76" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.842</text>

      <!-- Row 4 -->
      <rect x="0" y="90" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.3"/>
      <text x="19" y="106" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.795</text>
      <rect x="42" y="90" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.5"/>
      <text x="61" y="106" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.832</text>
      <rect x="84" y="90" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.65"/>
      <text x="103" y="106" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.867</text>
      <rect x="126" y="90" width="38" height="26" rx="2" fill="#315BE8" fill-opacity="0.4"/>
      <text x="145" y="106" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">.810</text>
    </g>
  </g>

  <g transform="translate(40, 235)">
    <text x="0" y="8" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" opacity="0.6">OPTIMUM: C=10.0, gamma=0.01 (Score: 0.948 with 5-fold Stratified CV)</text>
  </g>
</svg>
