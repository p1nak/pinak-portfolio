<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" class="project-vector-art">
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#191B1A"/>
    </linearGradient>
  </defs>

  <rect width="480" height="280" fill="url(#ab-bg)" rx="8"/>

  <!-- Technical header -->
  <text x="40" y="32" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1.5">GEOSPATIAL // 48,800+ NYC LISTINGS</text>
  <text x="350" y="32" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="9">ACC: 85.6% | F1: 0.742</text>

  <!-- Geospatial grid lines simulating Manhattan / Brooklyn / Queens coordinate mesh -->
  <g opacity="0.15" stroke="#F3EFE6" stroke-width="0.7">
    <path d="M 60 80 Q 140 100, 220 80 T 380 90"/>
    <path d="M 60 140 Q 160 160, 240 130 T 420 150"/>
    <path d="M 80 200 Q 180 220, 260 190 T 400 210"/>
    <line x1="120" y1="60" x2="160" y2="240"/>
    <line x1="200" y1="60" x2="230" y2="240"/>
    <line x1="280" y1="60" x2="310" y2="240"/>
    <line x1="360" y1="60" x2="380" y2="240"/>
  </g>

  <!-- Borough cluster contours -->
  <!-- Manhattan cluster: Entire home dense -->
  <ellipse cx="180" cy="120" rx="45" ry="32" fill="#315BE8" fill-opacity="0.15" stroke="#315BE8" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="170" cy="115" r="4" fill="#315BE8"/>
  <circle cx="190" cy="125" r="3.5" fill="#315BE8"/>
  <circle cx="160" cy="130" r="3" fill="#315BE8"/>
  <circle cx="195" cy="110" r="3" fill="#315BE8"/>
  <text x="180" y="100" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">MANHATTAN</text>

  <!-- Brooklyn cluster: Mixed private & entire -->
  <ellipse cx="270" cy="175" rx="55" ry="38" fill="#9CAF88" fill-opacity="0.15" stroke="#9CAF88" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="260" cy="165" r="4" fill="#9CAF88"/>
  <circle cx="280" cy="185" r="3.5" fill="#9CAF88"/>
  <circle cx="295" cy="160" r="3" fill="#315BE8"/>
  <circle cx="245" cy="180" r="3" fill="#9CAF88"/>
  <text x="270" y="152" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">BROOKLYN</text>

  <!-- Queens / Shared room cluster -->
  <ellipse cx="360" cy="130" rx="35" ry="25" fill="#CC6A42" fill-opacity="0.15" stroke="#CC6A42" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="355" cy="130" r="3.5" fill="#CC6A42"/>
  <circle cx="370" cy="125" r="3" fill="#CC6A42"/>
  <circle cx="350" cy="140" r="3" fill="#9CAF88"/>
  <text x="360" y="115" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">QUEENS</text>

  <!-- Legend 3 Classes -->
  <g transform="translate(60, 235)">
    <circle cx="6" cy="6" r="4" fill="#315BE8"/>
    <text x="16" y="9" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="8">Entire home / apt</text>

    <circle cx="150" cy="6" r="4" fill="#9CAF88"/>
    <text x="160" y="9" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="8">Private room</text>

    <circle cx="270" cy="6" r="4" fill="#CC6A42"/>
    <text x="280" y="9" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="8">Shared room</text>
  </g>
</svg>
