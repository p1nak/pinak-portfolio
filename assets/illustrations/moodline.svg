<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" class="project-vector-art">
  <defs>
    <linearGradient id="ml-bg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#181B19"/>
    </linearGradient>
    <linearGradient id="ml-wave-fwd" x1="40" y1="140" x2="440" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#315BE8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9CAF88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#315BE8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ml-wave-bwd" x1="440" y1="140" x2="40" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CC6A42" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D8C9B5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CC6A42" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="480" height="280" fill="url(#ml-bg)" rx="8"/>

  <!-- Technical Grid Overlay -->
  <g opacity="0.12" stroke="#F3EFE6" stroke-width="0.5">
    <line x1="40" y1="40" x2="440" y2="40"/>
    <line x1="40" y1="100" x2="440" y2="100"/>
    <line x1="40" y1="160" x2="440" y2="160"/>
    <line x1="40" y1="220" x2="440" y2="220"/>
    <line x1="80" y1="20" x2="80" y2="260"/>
    <line x1="160" y1="20" x2="160" y2="260"/>
    <line x1="240" y1="20" x2="240" y2="260"/>
    <line x1="320" y1="20" x2="320" y2="260"/>
    <line x1="400" y1="20" x2="400" y2="260"/>
  </g>

  <!-- Swiss Editorial Coordinate Tag -->
  <text x="24" y="32" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.8">SYS // BiGRU.NLP.EMOTION_VEC</text>
  <text x="456" y="32" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="end" opacity="0.85">ACC: 91.20% • 6 STATES</text>

  <!-- BiGRU Forward Layer (Past -> Future) -->
  <path d="M 50 140 C 90 90, 130 90, 170 140 C 210 190, 250 190, 290 140 C 330 90, 370 90, 430 140" fill="none" stroke="url(#ml-wave-fwd)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- BiGRU Backward Layer (Future -> Past) -->
  <path d="M 50 140 C 90 190, 130 190, 170 140 C 210 90, 250 90, 290 140 C 330 190, 370 190, 430 140" fill="none" stroke="url(#ml-wave-bwd)" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- Recurrent Neural Nodes & Synapses -->
  <!-- Node 1 -->
  <g transform="translate(90, 140)">
    <circle r="12" fill="#202321" stroke="#315BE8" stroke-width="2"/>
    <circle r="4" fill="#315BE8"/>
    <line x1="0" y1="-28" x2="0" y2="-12" stroke="#9CAF88" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="0" y="26" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" opacity="0.8">t-1</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(170, 140)">
    <circle r="14" fill="#202321" stroke="#9CAF88" stroke-width="2"/>
    <circle r="5" fill="#9CAF88"/>
    <line x1="0" y1="-32" x2="0" y2="-14" stroke="#9CAF88" stroke-width="1.5"/>
    <text x="0" y="28" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" opacity="0.8">t</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(250, 140)">
    <circle r="16" fill="#202321" stroke="#CC6A42" stroke-width="2.5"/>
    <circle r="6" fill="#CC6A42"/>
    <line x1="0" y1="-36" x2="0" y2="-16" stroke="#CC6A42" stroke-width="1.5"/>
    <text x="0" y="30" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" opacity="0.8">t+1</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(330, 140)">
    <circle r="14" fill="#202321" stroke="#315BE8" stroke-width="2"/>
    <circle r="5" fill="#315BE8"/>
    <line x1="0" y1="-32" x2="0" y2="-14" stroke="#315BE8" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="0" y="28" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" opacity="0.8">t+2</text>
  </g>

  <!-- Node 5 -->
  <g transform="translate(410, 140)">
    <circle r="12" fill="#202321" stroke="#D8C9B5" stroke-width="2"/>
    <circle r="4" fill="#D8C9B5"/>
    <text x="0" y="26" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" opacity="0.8">t+k</text>
  </g>

  <!-- 6 Emotion Discrete Output Channels Spectrum -->
  <g transform="translate(40, 230)">
    <!-- Joy -->
    <rect x="0" y="0" width="48" height="6" rx="2" fill="#315BE8"/>
    <text x="24" y="16" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle" opacity="0.7">JOY</text>
    <!-- Sadness -->
    <rect x="62" y="0" width="48" height="6" rx="2" fill="#9CAF88"/>
    <text x="86" y="16" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle" opacity="0.7">SADNESS</text>
    <!-- Anger -->
    <rect x="124" y="0" width="48" height="6" rx="2" fill="#CC6A42"/>
    <text x="148" y="16" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle" opacity="0.7">ANGER</text>
    <!-- Fear -->
    <rect x="186" y="0" width="48" height="6" rx="2" fill="#D8C9B5"/>
    <text x="210" y="16" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle" opacity="0.7">FEAR</text>
    <!-- Love -->
    <rect x="248" y="0" width="48" height="6" rx="2" fill="#315BE8" fill-opacity="0.6"/>
    <text x="272" y="16" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle" opacity="0.7">LOVE</text>
    <!-- Surprise -->
    <rect x="310" y="0" width="48" height="6" rx="2" fill="#9CAF88" fill-opacity="0.6"/>
    <text x="334" y="16" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle" opacity="0.7">SURPRISE</text>
  </g>

  <!-- Precision Corner Calipers -->
  <path d="M 40 48 L 40 40 L 48 40" stroke="#F3EFE6" stroke-width="1.5" opacity="0.4"/>
  <path d="M 440 48 L 440 40 L 432 40" stroke="#F3EFE6" stroke-width="1.5" opacity="0.4"/>
  <path d="M 40 232 L 40 240 L 48 240" stroke="#F3EFE6" stroke-width="1.5" opacity="0.4"/>
  <path d="M 440 232 L 440 240 L 432 240" stroke="#F3EFE6" stroke-width="1.5" opacity="0.4"/>
</svg>
