<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" class="project-vector-art">
  <defs>
    <linearGradient id="lstm-bg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#191B1A"/>
    </linearGradient>
  </defs>

  <rect width="480" height="280" fill="url(#lstm-bg)" rx="8"/>

  <text x="24" y="32" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.8">RECURRENT // STACKED LSTM CELL</text>
  <text x="456" y="32" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="end">STREAMLIT LIVE INFERENCE</text>

  <!-- LSTM Cell Boundary Box -->
  <rect x="90" y="60" width="300" height="150" rx="6" fill="#202321" stroke="#315BE8" stroke-width="1.8"/>

  <!-- Top Cell State Highway C_{t-1} -> C_t -->
  <line x1="40" y1="90" x2="440" y2="90" stroke="#9CAF88" stroke-width="2.5"/>
  <circle cx="160" cy="90" r="10" fill="#202321" stroke="#9CAF88" stroke-width="2"/>
  <text x="160" y="93" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">×</text>
  
  <circle cx="280" cy="90" r="10" fill="#202321" stroke="#9CAF88" stroke-width="2"/>
  <text x="280" y="93" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">+</text>

  <text x="45" y="80" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7.5">C_{t-1}</text>
  <text x="425" y="80" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7.5">C_t</text>

  <!-- Hidden State Highway h_{t-1} -> h_t -->
  <line x1="40" y1="180" x2="90" y2="180" stroke="#315BE8" stroke-width="2"/>
  <line x1="390" y1="180" x2="440" y2="180" stroke="#315BE8" stroke-width="2"/>
  <text x="45" y="172" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="7.5">h_{t-1}</text>
  <text x="425" y="172" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="7.5">h_t</text>

  <!-- Internal Gates: Forget Gate (f_t), Input Gate (i_t), Candidate (\tilde{C}_t), Output Gate (o_t) -->
  <!-- Forget Gate f_t -->
  <g transform="translate(145, 140)">
    <rect width="30" height="24" rx="3" fill="#202321" stroke="#CC6A42" stroke-width="1.2"/>
    <text x="15" y="16" fill="#CC6A42" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">σ</text>
    <line x1="15" y1="24" x2="15" y2="40" stroke="#CC6A42" stroke-width="1.2"/>
    <line x1="15" y1="0" x2="15" y2="-40" stroke="#CC6A42" stroke-width="1.2"/>
  </g>

  <!-- Input Gate i_t -->
  <g transform="translate(210, 140)">
    <rect width="30" height="24" rx="3" fill="#202321" stroke="#315BE8" stroke-width="1.2"/>
    <text x="15" y="16" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">σ</text>
    <line x1="15" y1="24" x2="15" y2="40" stroke="#315BE8" stroke-width="1.2"/>
  </g>

  <!-- Candidate tanh -->
  <g transform="translate(255, 140)">
    <rect width="36" height="24" rx="3" fill="#202321" stroke="#9CAF88" stroke-width="1.2"/>
    <text x="18" y="16" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">tanh</text>
    <line x1="18" y1="24" x2="18" y2="40" stroke="#9CAF88" stroke-width="1.2"/>
    <line x1="18" y1="0" x2="25" y2="-40" stroke="#9CAF88" stroke-width="1.2"/>
  </g>

  <!-- Output Gate o_t -->
  <g transform="translate(320, 140)">
    <rect width="30" height="24" rx="3" fill="#202321" stroke="#D8C9B5" stroke-width="1.2"/>
    <text x="15" y="16" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">σ</text>
    <line x1="15" y1="24" x2="15" y2="40" stroke="#D8C9B5" stroke-width="1.2"/>
    <line x1="15" y1="0" x2="15" y2="-20" stroke="#D8C9B5" stroke-width="1.2"/>
  </g>

  <!-- Interactive Token Prediction Ribbon -->
  <g transform="translate(40, 235)">
    <text x="0" y="8" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" opacity="0.6">INPUT SEQUENCE: "deep learning is"</text>
    <rect x="220" y="-4" width="70" height="18" rx="2" fill="#315BE8" fill-opacity="0.2" stroke="#315BE8" stroke-width="1"/>
    <text x="255" y="8" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" text-anchor="middle">→ transformative</text>
    <text x="340" y="8" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="7" opacity="0.7">(p = 0.84)</text>
  </g>
</svg>
