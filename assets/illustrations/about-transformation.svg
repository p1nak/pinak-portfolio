<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" preserveAspectRatio="xMidYMid meet" fill="none" class="about-hero-art" role="img" aria-label="Cognitive Continuum: Architecture diagram showing the transition from raw telemetry through tensor math to deep learning and applied production engineering">
  <defs>
    <linearGradient id="ab-grad-bg" x1="0" y1="0" x2="600" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#141715"/>
    </linearGradient>
    <linearGradient id="beam-grad" x1="36" y1="210" x2="564" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9CAF88" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#315BE8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#CC6A42" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9CAF88" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="440" fill="url(#ab-grad-bg)" rx="12"/>

  <!-- Architectural Background Grid -->
  <g opacity="0.10" stroke="#F3EFE6" stroke-width="0.75">
    <line x1="36" y1="46" x2="564" y2="46"/>
    <line x1="36" y1="130" x2="564" y2="130"/>
    <line x1="36" y1="214" x2="564" y2="214"/>
    <line x1="36" y1="310" x2="564" y2="310"/>
    <line x1="36" y1="395" x2="564" y2="395"/>
    <line x1="150" y1="20" x2="150" y2="420"/>
    <line x1="300" y1="20" x2="300" y2="420"/>
    <line x1="450" y1="20" x2="450" y2="420"/>
  </g>

  <!-- Editorial Top Bar (Zero Overlap Guaranteed) -->
  <text x="36" y="32" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="1.5">SYSTEMIC EVOLUTION</text>
  <text x="564" y="32" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end" opacity="0.8">DATA → INTELLIGENCE → DEPLOYMENT</text>

  <!-- ================= STAGE 1: RAW TELEMETRY ================= -->
  <g transform="translate(36, 62)">
    <text x="0" y="0" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">01 // RAW TELEMETRY</text>
    <text x="0" y="13" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7.5" opacity="0.75">Unstructured bytes &amp; signals</text>

    <!-- Signal Cluster Box -->
    <g transform="translate(0, 22)">
      <rect width="130" height="84" rx="5" fill="#202321" stroke="#9CAF88" stroke-width="1" stroke-opacity="0.8"/>
      <!-- Internal grid lines -->
      <line x1="10" y1="42" x2="120" y2="42" stroke="#9CAF88" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="2 2"/>
      <line x1="65" y1="10" x2="65" y2="74" stroke="#9CAF88" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="2 2"/>
      
      <!-- Coordinate dots -->
      <circle cx="24" cy="24" r="2.5" fill="#9CAF88"/>
      <circle cx="48" cy="18" r="2" fill="#D8C9B5"/>
      <circle cx="92" cy="22" r="3" fill="#9CAF88"/>
      <circle cx="112" cy="30" r="2" fill="#F3EFE6"/>

      <circle cx="34" cy="48" r="3" fill="#F3EFE6"/>
      <circle cx="65" cy="42" r="3.5" fill="#9CAF88"/>
      <circle cx="98" cy="52" r="2.5" fill="#D8C9B5"/>

      <circle cx="20" cy="66" r="2" fill="#D8C9B5"/>
      <circle cx="48" cy="62" r="3" fill="#9CAF88"/>
      <circle cx="78" cy="68" r="2.5" fill="#F3EFE6"/>
      <circle cx="108" cy="64" r="2" fill="#9CAF88"/>
    </g>
  </g>

  <!-- Vector Transition 1 -> 2 -->
  <g transform="translate(174, 126)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#315BE8" stroke-width="2" stroke-linecap="round"/>
    <polygon points="34,-3 40,0 34,3" fill="#315BE8"/>
    <circle cx="17" cy="0" r="3" fill="#202321" stroke="#315BE8" stroke-width="1.5"/>
  </g>

  <!-- ================= STAGE 2: TENSOR SPACE ================= -->
  <g transform="translate(222, 62)">
    <text x="0" y="0" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">02 // TENSOR SPACE</text>
    <text x="0" y="13" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7.5" opacity="0.75">Vector projections &amp; math</text>

    <!-- Matrix Box -->
    <g transform="translate(0, 22)">
      <rect width="138" height="84" rx="5" fill="#202321" stroke="#315BE8" stroke-width="1" stroke-opacity="0.8"/>
      <!-- Matrix grid representation -->
      <line x1="12" y1="28" x2="126" y2="28" stroke="#315BE8" stroke-width="0.8" opacity="0.4"/>
      <line x1="12" y1="56" x2="126" y2="56" stroke="#315BE8" stroke-width="0.8" opacity="0.4"/>
      <line x1="48" y1="12" x2="48" y2="72" stroke="#315BE8" stroke-width="0.8" opacity="0.4"/>
      <line x1="90" y1="12" x2="90" y2="72" stroke="#315BE8" stroke-width="0.8" opacity="0.4"/>

      <!-- Matrix Values -->
      <text x="30" y="22" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">x₁</text>
      <text x="69" y="22" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">x₂</text>
      <text x="108" y="22" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">xₙ</text>

      <text x="30" y="46" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">W₁₁</text>
      <text x="69" y="46" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">W₁₂</text>
      <text x="108" y="46" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">W₁ₙ</text>

      <text x="69" y="70" fill="#CC6A42" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">f(Wx + b)</text>
    </g>
  </g>

  <!-- Vector Transition 2 -> 3 -->
  <g transform="translate(368, 126)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#CC6A42" stroke-width="2" stroke-linecap="round"/>
    <polygon points="34,-3 40,0 34,3" fill="#CC6A42"/>
    <circle cx="17" cy="0" r="3" fill="#202321" stroke="#CC6A42" stroke-width="1.5"/>
  </g>

  <!-- ================= STAGE 3: DEEP LEARNING ================= -->
  <g transform="translate(416, 62)">
    <text x="0" y="0" fill="#CC6A42" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">03 // DEEP LEARNING</text>
    <text x="0" y="13" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7.5" opacity="0.75">BiGRU, LSTM &amp; Ensembles</text>

    <!-- Synapse Network Box -->
    <g transform="translate(0, 22)">
      <rect width="148" height="84" rx="5" fill="#202321" stroke="#CC6A42" stroke-width="1" stroke-opacity="0.8"/>
      
      <!-- Input layer -->
      <circle cx="22" cy="24" r="5" fill="#202321" stroke="#315BE8" stroke-width="1.5"/>
      <circle cx="22" cy="60" r="5" fill="#202321" stroke="#315BE8" stroke-width="1.5"/>

      <!-- Hidden recurrent layer -->
      <circle cx="74" cy="18" r="6" fill="#202321" stroke="#CC6A42" stroke-width="1.8"/>
      <circle cx="74" cy="42" r="6" fill="#202321" stroke="#9CAF88" stroke-width="1.8"/>
      <circle cx="74" cy="66" r="6" fill="#202321" stroke="#CC6A42" stroke-width="1.8"/>

      <!-- Output layer -->
      <circle cx="126" cy="42" r="5.5" fill="#202321" stroke="#315BE8" stroke-width="1.5"/>

      <!-- Synapse connections -->
      <line x1="27" y1="24" x2="68" y2="18" stroke="#F3EFE6" stroke-width="0.8" opacity="0.35"/>
      <line x1="27" y1="24" x2="68" y2="42" stroke="#F3EFE6" stroke-width="0.8" opacity="0.35"/>
      <line x1="27" y1="60" x2="68" y2="42" stroke="#F3EFE6" stroke-width="0.8" opacity="0.35"/>
      <line x1="27" y1="60" x2="68" y2="66" stroke="#F3EFE6" stroke-width="0.8" opacity="0.35"/>

      <line x1="80" y1="18" x2="120" y2="42" stroke="#CC6A42" stroke-width="1.2" opacity="0.7"/>
      <line x1="80" y1="42" x2="120" y2="42" stroke="#9CAF88" stroke-width="1.4" opacity="0.9"/>
      <line x1="80" y1="66" x2="120" y2="42" stroke="#CC6A42" stroke-width="1.2" opacity="0.7"/>

      <!-- Bi-directional recurrence loop indicator -->
      <path d="M 68 18 C 54 28, 54 56, 68 66" fill="none" stroke="#CC6A42" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- ================= LOWER LEVEL: BRIDGING TO PRODUCTION ================= -->
  <!-- Dynamic Gradient Flow Beam -->
  <path d="M 36 195 C 180 220, 380 180, 564 205" fill="none" stroke="url(#beam-grad)" stroke-width="2.5" stroke-linecap="round"/>

  <g transform="translate(36, 222)">
    <!-- Left Box: Software Engineering -->
    <g>
      <rect x="0" y="0" width="254" height="152" rx="7" fill="#181B19" stroke="#315BE8" stroke-width="1.2"/>
      <text x="16" y="24" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1">APPLIED SOFTWARE ENGINEERING</text>
      <line x1="16" y1="32" x2="238" y2="32" stroke="#315BE8" stroke-width="0.6" opacity="0.4"/>

      <!-- Items -->
      <g transform="translate(16, 48)">
        <circle cx="4" cy="4" r="2" fill="#315BE8"/>
        <text x="14" y="7" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="8" font-weight="500">FastAPI REST Microservices</text>
        <text x="14" y="19" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7" opacity="0.7">Async inference &amp; schema validation</text>
      </g>

      <g transform="translate(16, 78)">
        <circle cx="4" cy="4" r="2" fill="#9CAF88"/>
        <text x="14" y="7" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="8" font-weight="500">Interactive Plotly/Dash Analytics</text>
        <text x="14" y="19" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7" opacity="0.7">Real-time feature exploration</text>
      </g>

      <g transform="translate(16, 108)">
        <circle cx="4" cy="4" r="2" fill="#CC6A42"/>
        <text x="14" y="7" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="8" font-weight="500">Industrial IoT &amp; Telemetry Pipelines</text>
        <text x="14" y="19" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7" opacity="0.7">Sensor signal processing &amp; QR tracking</text>
      </g>
    </g>

    <!-- Right Box: Production Value & Metrics -->
    <g transform="translate(274, 0)">
      <rect x="0" y="0" width="254" height="152" rx="7" fill="#181B19" stroke="#9CAF88" stroke-width="1.2"/>
      <text x="16" y="24" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1">VERIFIED PRODUCTION METRICS</text>
      <line x1="16" y1="32" x2="238" y2="32" stroke="#9CAF88" stroke-width="0.6" opacity="0.4"/>

      <!-- Items -->
      <g transform="translate(16, 48)">
        <text x="0" y="7" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">91.20%</text>
        <text x="46" y="7" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="8" font-weight="500">BiGRU Emotion Classification</text>
        <text x="0" y="19" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7" opacity="0.7">Six-class text sentiment analysis</text>
      </g>

      <g transform="translate(16, 78)">
        <text x="0" y="7" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">0.939</text>
        <text x="46" y="7" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="8" font-weight="500">ROC-AUC Credit Risk Engine</text>
        <text x="0" y="19" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7" opacity="0.7">Calibrated XGBoost with SHAP explanations</text>
      </g>

      <g transform="translate(16, 108)">
        <text x="0" y="7" fill="#CC6A42" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">52 Feat</text>
        <text x="46" y="7" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="8" font-weight="500">Gearbox Fault Diagnostic</text>
        <text x="0" y="19" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7" opacity="0.7">4-channel vibration spectrum ML</text>
      </g>
    </g>
  </g>

  <!-- Editorial Signature Footer -->
  <text x="36" y="416" fill="#D8C9B5" font-family="'DM Serif Display', Georgia, serif" font-size="11.5" font-style="italic">"I turn data into intelligence and ideas into useful software."</text>
  <text x="564" y="416" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" text-anchor="end">— PINAK CHAUHAN</text>
</svg>