<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" class="project-vector-art">
  <defs>
    <linearGradient id="sw-bg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#181A19"/>
    </linearGradient>
    <linearGradient id="sw-radar-fill" x1="130" y1="60" x2="130" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9CAF88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#315BE8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="480" height="280" fill="url(#sw-bg)" rx="8"/>

  <text x="40" y="32" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1.5">REGRESSION // 5,000 COHORT LIFESTYLE FIT</text>
  <text x="340" y="32" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="9">R²: 0.8776 | MAE: 0.3472</text>

  <!-- Left: 12-Dimensional Lifestyle Radar Compass -->
  <g transform="translate(130, 140)">
    <!-- Concentric radar circles -->
    <circle r="60" stroke="#F3EFE6" stroke-width="0.5" stroke-opacity="0.15" fill="none"/>
    <circle r="40" stroke="#F3EFE6" stroke-width="0.5" stroke-opacity="0.15" fill="none"/>
    <circle r="20" stroke="#F3EFE6" stroke-width="0.5" stroke-opacity="0.15" fill="none"/>
    <!-- Radar Axes (12 factors) -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#F3EFE6" stroke-width="0.6" stroke-opacity="0.2"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#F3EFE6" stroke-width="0.6" stroke-opacity="0.2"/>
    <line x1="-42" y1="-42" x2="42" y2="42" stroke="#F3EFE6" stroke-width="0.6" stroke-opacity="0.2"/>
    <line x1="-42" y1="42" x2="42" y2="-42" stroke="#F3EFE6" stroke-width="0.6" stroke-opacity="0.2"/>

    <!-- Radar Polygon Profile -->
    <polygon points="0,-48 24,-30 42,0 35,28 0,52 -32,24 -46,-5 -22,-36" fill="url(#sw-radar-fill)" stroke="#9CAF88" stroke-width="1.8"/>

    <!-- Key vertices -->
    <circle cx="0" cy="-48" r="3" fill="#315BE8"/>
    <circle cx="42" cy="0" r="3" fill="#CC6A42"/>
    <circle cx="0" cy="52" r="3" fill="#9CAF88"/>
    <circle cx="-46" cy="-5" r="3" fill="#D8C9B5"/>

    <text x="0" y="-66" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Sleep Quality</text>
    <text x="68" y="3" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7">Study Load</text>
    <text x="0" y="72" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Physical Health</text>
    <text x="-68" y="3" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7" text-anchor="end">Stress Factor</text>
  </g>

  <!-- Right: Random Forest Regression Curve & Residual Dispersion -->
  <g transform="translate(255, 60)">
    <text x="0" y="10" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8.5">REGRESSION RESIDUAL ENVELOPE</text>

    <!-- Axes -->
    <line x1="10" y1="140" x2="190" y2="140" stroke="#F3EFE6" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="140" x2="10" y2="20" stroke="#F3EFE6" stroke-width="1" opacity="0.4"/>

    <!-- 45 Degree Perfect Parity Line -->
    <line x1="10" y1="140" x2="180" y2="25" stroke="#D8C9B5" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4"/>

    <!-- Confidence Interval Envelope Band -->
    <path d="M 10 135 L 50 102 L 100 68 L 150 38 L 180 18 L 180 32 L 150 52 L 100 82 L 50 116 L 10 145 Z" fill="#315BE8" fill-opacity="0.12"/>

    <!-- Regression Line (R² = 0.8776) -->
    <line x1="10" y1="140" x2="180" y2="25" stroke="#315BE8" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Scatter dots (5,000 cohort sample) -->
    <circle cx="35" cy="120" r="2" fill="#9CAF88" opacity="0.8"/>
    <circle cx="50" cy="105" r="2.5" fill="#315BE8" opacity="0.8"/>
    <circle cx="65" cy="100" r="2" fill="#CC6A42" opacity="0.8"/>
    <circle cx="80" cy="82" r="2.5" fill="#9CAF88" opacity="0.8"/>
    <circle cx="95" cy="72" r="2" fill="#315BE8" opacity="0.8"/>
    <circle cx="110" cy="62" r="2.5" fill="#D8C9B5" opacity="0.8"/>
    <circle cx="125" cy="50" r="2" fill="#CC6A42" opacity="0.8"/>
    <circle cx="140" cy="42" r="2.5" fill="#315BE8" opacity="0.8"/>
    <circle cx="155" cy="30" r="2" fill="#9CAF88" opacity="0.8"/>
    <circle cx="170" cy="22" r="2.5" fill="#315BE8" opacity="0.8"/>

    <!-- Metric Callout -->
    <rect x="90" y="105" width="95" height="26" rx="3" fill="#202321" stroke="#9CAF88" stroke-width="1"/>
    <text x="137" y="117" fill="#F3EFE6" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">RMSE: 0.4637</text>
    <text x="137" y="127" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">MAE: 0.3472</text>
  </g>

  <!-- Educational Disclaimer Footer Banner -->
  <rect x="40" y="235" width="400" height="24" rx="3" fill="#202321" stroke="#CC6A42" stroke-width="0.8"/>
  <text x="50" y="250" fill="#CC6A42" font-family="'Inter', sans-serif" font-size="7.5">⚠ Educational estimate only. Not a clinical assessment, diagnosis, or healthcare substitute.</text>
</svg>
