<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none" class="project-vector-art">
  <defs>
    <linearGradient id="gp-bg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202321"/>
      <stop offset="100%" stop-color="#171918"/>
    </linearGradient>
  </defs>

  <rect width="480" height="280" fill="url(#gp-bg)" rx="8"/>

  <text x="24" y="32" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.8">ENTERPRISE // SIH101 PLATFORM</text>
  <text x="456" y="32" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="end">DJANGO 5.2 • 24 MODELS / 57 ENDPOINTS*</text>

  <!-- Flow pipeline: Taxonomy -> Gemini GenAI -> Human Review -> Assessment Engine -->
  <!-- Box 1: Competency Taxonomy -->
  <g transform="translate(40, 75)">
    <rect width="85" height="70" rx="4" fill="#202321" stroke="#315BE8" stroke-width="1.2"/>
    <text x="42" y="24" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">TAXONOMY</text>
    <text x="42" y="40" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5" text-anchor="middle">Skill Matrix</text>
    <text x="42" y="54" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Role Paths</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 125 110 L 145 110" stroke="#315BE8" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="135" cy="110" r="3" fill="#315BE8"/>

  <!-- Box 2: Google Gemini GenAI -->
  <g transform="translate(145, 75)">
    <rect width="95" height="70" rx="4" fill="#202321" stroke="#9CAF88" stroke-width="1.2"/>
    <text x="47" y="24" fill="#9CAF88" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">GEMINI API</text>
    <text x="47" y="40" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5" text-anchor="middle">GenAI MCQ Synth</text>
    <text x="47" y="54" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Adaptive Difficulty</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 240 110 L 260 110" stroke="#9CAF88" stroke-width="2"/>
  <circle cx="250" cy="110" r="3" fill="#9CAF88"/>

  <!-- Box 3: Human-in-the-Loop Review -->
  <g transform="translate(260, 75)">
    <rect width="90" height="70" rx="4" fill="#202321" stroke="#CC6A42" stroke-width="1.5"/>
    <text x="45" y="24" fill="#CC6A42" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">HUMAN REVIEW</text>
    <text x="45" y="40" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5" text-anchor="middle">Trainer Approval</text>
    <text x="45" y="54" fill="#CC6A42" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">Curated Quality</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 350 110 L 370 110" stroke="#CC6A42" stroke-width="2"/>
  <circle cx="360" cy="110" r="3" fill="#CC6A42"/>

  <!-- Box 4: Assessment & Analytics -->
  <g transform="translate(370, 75)">
    <rect width="70" height="70" rx="4" fill="#202321" stroke="#315BE8" stroke-width="1.2"/>
    <text x="35" y="24" fill="#315BE8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">DELIVERY</text>
    <text x="35" y="40" fill="#F3EFE6" font-family="'Inter', sans-serif" font-size="7.5" text-anchor="middle">Live Quizzes</text>
    <text x="35" y="54" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Analytics</text>
  </g>

  <!-- Feedback Loop path back to taxonomy -->
  <path d="M 405 145 L 405 180 L 82 180 L 82 145" fill="none" stroke="#D8C9B5" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="240" y="174" fill="#D8C9B5" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">CONTINUOUS ADAPTIVE RECOMMENDATIONS LOOP</text>

  <!-- Documentation Attribution Footer -->
  <g transform="translate(40, 230)">
    <rect width="400" height="26" rx="3" fill="#202321" stroke="#315BE8" stroke-width="0.8"/>
    <text x="15" y="16" fill="#D8C9B5" font-family="'Inter', sans-serif" font-size="7">* Metrics (24 models, 57 endpoints) from official repository documentation.</text>
  </g>
</svg>
